id: SSH-002
name: SSH password spraying
description: One IP tries failed logins against many different accounts (few tries each).
severity: high
mitre:
  id: T1110.003
  name: "Brute Force: Password Spraying"
  tactic: Credential Access
match:
  event_type: ssh_failed_login
group_by: [src_ip]
distinct: user
threshold: 10
window: 30m